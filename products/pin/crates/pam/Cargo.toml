[package]
name = "pam_properpin"
description = "properpin's PAM module, pam_properpin.so: a PIN for the KDE lock screen, within limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib is the module libpam loads. Cargo names it libpam_properpin.so; installing renames it
# to pam_properpin.so. rlib lets the tests in tests/ build against it.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc.workspace = true
properpin-core.workspace = true
properpin-sys.workspace = true

[dev-dependencies]
pamharness.workspace = true
properpin-sys.workspace = true
tempfile.workspace = true

[lints]
workspace = true
