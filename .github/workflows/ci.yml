# CI for propersec: the tests in Fedora 44, clippy and rustfmt with Fedora's toolchain, the podman
# system test, a dependency audit, and the tests again with exactly the declared rust-version.
# Mutation testing has its own weekly workflow (mutants.yml). Every third-party action is pinned
# to a commit; Dependabot bumps them.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Fedora 44)
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    env:
      CARGO_HOME: /cargo
    steps:
      - name: Install build dependencies
        # install.sh, which the install tests run, needs diff and cmp; git, tar and zstd are for
        # checkout and the cache.
        run: dnf -y install --setopt=install_weak_deps=False rust cargo gcc libxcrypt-devel diffutils git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Add an unprivileged user
        # pam_screenlock_pin refuses to run as root, as the lock screen never does, so the stack tests
        # run as a plain user.
        run: |
          useradd --create-home tester
          mkdir -p "$CARGO_HOME"
          chown -R tester: "$CARGO_HOME" "$GITHUB_WORKSPACE"
      - name: cargo test
        run: runuser -u tester -- cargo test --workspace --locked

  lint:
    name: Lint (clippy, rustfmt; Fedora 44)
    # The same two commands as `just lint`. clippy's findings change between versions, so
    # this uses the toolchain Fedora ships, like the test job, not the newest one.
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    steps:
      - name: Install build dependencies, clippy and rustfmt
        run: dnf -y install --setopt=install_weak_deps=False rust cargo clippy rustfmt gcc libxcrypt-devel git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Versions
        run: |
          cargo clippy --version
          cargo fmt --version
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo fmt
        run: cargo fmt --all --check

  podman:
    name: System test (podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: podman version
        # The container shares these with the runner's kernel; protected_regular=2 limits what even
        # root may open in /var/lib/screenlock-pin, which the scenarios have to respect.
        run: |
          podman version
          sysctl fs.protected_regular fs.protected_symlinks
      # The two commands behind `just podman`, but with rootful podman. Rootless podman
      # on this runner builds the image fine, but setuid unix_chkpwd can't read /etc/shadow inside
      # it ("check pass; user unknown"), so the real password never unlocks. Storage is kernel
      # overlay without nosuid there, so the cause is something else; not yet pinned down.
      - name: Build the test image
        run: sudo podman build --quiet --ignorefile testing/podman/Containerfile.containerignore -f testing/podman/Containerfile -t screenlock-pin-systest .
      - name: Run the scenarios
        run: sudo podman run --rm --init --network=none screenlock-pin-systest
      # The same as `just release`: the build install.sh installs by default, checked to load only
      # the system's libraries. Checked in a fresh Fedora 44, with only what check-build needs added
      # (readelf from binutils): the runner is Ubuntu, whose libcrypt.so.1 isn't the libcrypt.so.2
      # the build needs, and podman leaves target/screenlock-pin root's and 0700 under sudo anyway.
      - name: Release build
        run: |
          sudo podman build --quiet --ignorefile testing/podman/Containerfile.containerignore -f packaging/Containerfile -o target/screenlock-pin .
          sudo podman run --rm --security-opt label=disable -v "$PWD/target/screenlock-pin:/build:ro" -v "$PWD/packaging:/packaging:ro" \
            registry.fedoraproject.org/fedora:44 \
            bash -c 'dnf -y -q install --setopt=install_weak_deps=False binutils diffutils && /packaging/install.sh check-build --from /build'
      # install.sh uninstall against deliberately broken installs, a fresh container per case.
      - name: Run the uninstall cases
        run: sudo testing/podman/uninstall-cases.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none
      - name: cargo deny (advisories)
        run: cargo deny --locked check advisories
      - name: cargo audit
        run: cargo audit
      - name: cargo deny (licences, bans, sources; warnings only)
        # See deny.toml: these don't fail the job yet, but any error shows up as a warning.
        run: cargo deny --locked check licenses bans sources || echo "::warning title=cargo-deny::licences, bans or sources need a look; see the log of this step"

  rust-version:
    name: Rust 1.98 (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98 and libxcrypt's development files
        run: |
          rustup toolchain install 1.98 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcrypt-dev
          rustc --version
          dpkg-query -W libpam0g libcrypt-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --workspace --locked
